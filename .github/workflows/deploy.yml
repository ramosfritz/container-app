name: Deploy to Azure Container Apps

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Build, Push and Deploy
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.6

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Initialize Terraform
      - name: Terraform Init
        run: |
          cd terraform
          terraform init

      # Targeted apply to ensure Resource Group & ACR exist before building images
      - name: Deploy Container Registry
        run: |
          cd terraform
          terraform apply -target=azurerm_container_registry.acr -auto-approve

      # Log in to ACR using Azure CLI helper
      - name: Log in to Azure Container Registry
        run: |
          az acr login --name acrfritzramoscontainerapp

      # Build and Push Backend Image (tagged with Git Commit SHA)
      - name: Build & Push Backend Image
        run: |
          docker build -t acrfritzramoscontainerapp.azurecr.io/backend:${{ github.sha }} ./backend
          docker push acrfritzramoscontainerapp.azurecr.io/backend:${{ github.sha }}

      # Build and Push Frontend Image (tagged with Git Commit SHA)
      - name: Build & Push Frontend Image
        run: |
          docker build -t acrfritzramoscontainerapp.azurecr.io/frontend:${{ github.sha }} ./frontend
          docker push acrfritzramoscontainerapp.azurecr.io/frontend:${{ github.sha }}

      # Full Terraform apply passing the image tags to ACA
      - name: Terraform Apply
        run: |
          cd terraform
          terraform apply \
            -var="backend_image_tag=${{ github.sha }}" \
            -var="frontend_image_tag=${{ github.sha }}" \
            -auto-approve
